name: Build, Generate, and Deploy Data

on:
  push:
    branches:
      - main
      - v2
  schedule:
    - cron: '0 8 * * *' # Runs at 08:00 UTC every day.
  workflow_dispatch: # For manually running the action

jobs:
  build-and-deploy:
    if: github.ref != 'refs/heads/v2'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3
      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install 🔧
        run: |
          npm ci
          npm i @icemourne/tool-box

      - name: Build 🔨
        run: npm run build

      - name: Generate 🏗️
        run: npm run generate

      - name: Check if there are any changes 📦
        id: verify_diff
        run: |
          git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Deploy 🚀
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config --global user.email "cboweris@gmail.com"
          git config --global user.name "Ice-mourne"
          git add .
          git commit -m "deploy"
          git push

  refresh-v2:
    if: github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: generator-v2
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build and verify v2
        run: npm run check:v2
      - name: Regenerate
        run: npm run generate
      - name: Commit only v2 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- templates/v2
          if ! git diff --cached --quiet; then
            git commit -m "Refresh v2 manifest data"
            git push origin HEAD:refs/heads/v2
          fi
