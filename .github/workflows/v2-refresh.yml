name: Refresh v2 data

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generator-v2
  cancel-in-progress: true

jobs:
  refresh:
    if: github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Build and verify v2
        run: npm run check:v2
      - name: Regenerate
        run: npm run generate
      - name: Commit only v2 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- templates/v2
          if ! git diff --cached --quiet; then
            git commit -m "Refresh v2 manifest data"
            git push origin HEAD:refs/heads/v2
          fi
